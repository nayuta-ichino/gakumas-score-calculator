name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'demo/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on:  ubuntu-latest
    steps:
      #1.GithubからコードをDL
      - name: Check out repository
        uses: actions/checkout@v4
      #2.OIDC 認証（OpenID Connect）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::619796924515:role/GitHubActions-CD-Role
          aws-region: ap-southeast-2
      #3.ECRへログイン
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      #4.Dockerイメージをビルド & タグ付け & ECRへプッシュ
            